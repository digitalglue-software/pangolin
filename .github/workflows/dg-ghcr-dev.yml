name: DG Dev Image (GHCR)

# DigitalGlue-only: build the patched Pangolin dev image (sqlite) and push it to
# our GHCR so the crypto lab can pull instead of building locally. GHCR-only, uses
# the built-in GITHUB_TOKEN — no external secrets. Not the upstream release pipeline.

on:
  push:
    branches:
      - feat/idp-session-exchange
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/pangolin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (sqlite dev)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            DATABASE=sqlite
            VERSION=dev
            REVISION=${{ github.sha }}
            IMAGE_TITLE=Pangolin
            IMAGE_DESCRIPTION=DigitalGlue patched Pangolin (idp-session-exchange)
          tags: |
            ${{ env.IMAGE }}:idp-session-exchange
            ${{ env.IMAGE }}:idp-session-exchange-${{ github.sha }}
